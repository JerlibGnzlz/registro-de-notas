<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>Inicio de Sesión</title>
</head>

<body class="bg-gray-200 h-screen m-0 p-0">
  <!-- Encabezado centrado -->
  <header class="text-center py-4">
    <h1 class="text-xl font-bold">Inicia Sesión</h1>
  </header>

  <!-- Menú de navegación posicionado en la esquina superior derecha -->
  <nav class="left-4 flex flex-col  space-y-20 bg-sky-500 p-4 rounded shadow-md absolute top-4 h-screen">
    <h4 id="inicio" class="font-medium">Inicio</h4>
    <a href="../login/login.html" class="hover:underline">
      <h4 class="font-medium">Iniciar Sesión</h4>
    </a>
    <a href="../register/register.html" class="hover:underline">
      <h4 class="font-medium">Registrarse</h4>
    </a>
  </nav>

  <!-- Contenedor para centrar el formulario en la pantalla -->
  <div class="flex items-center justify-center">
    <form id="loginForm" class="flex flex-col items-center justify-center space-y-4 bg-white p-8 rounded shadow-md">
      <div class="flex flex-col w-full">
        <label for="emailInput" class="mb-1">Correo Electrónico</label>
        <input type="email" id="emailInput" class="border p-2 rounded" placeholder="ejemplo@correo.com">
      </div>

      <div class="flex flex-col w-full">
        <label for="passwordInput" class="mb-1">Contraseña</label>
        <input type="password" id="passwordInput" class="border p-2 rounded">
      </div>


      <button type="submit" id="registerButton"
        class="mt-2 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 active:bg-blue-700 rounded-x2">
        Enviar
      </button>
    </form>
  </div>

  <footer class="text-center py-4">
    Registo de Notas, 2025
  </footer>
  <script src="../../assets/js/login.js" type="module"></script>
</body>

</html>
