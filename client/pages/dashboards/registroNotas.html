<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>Registro de Notas</title>
</head>
<body class="bg-teal-600 h-screen w-screen flex items-center justify-center">
    <main class="bg-sky-200 h-auto w-300 flex flex-col items-center  rounded-md">
        <div class="ingreso">
        <header class="rounded-md bg-cyan-400 text-center w-full p-4  my-2">
            <h1 class="text-xl font-bold">Registro de Notas</h1>
        </header>
        <form action="" class="flex flex-col items-center justify-center space-y-4 bg-white p-8 rounded shadow-md w-full">
            <label for="nameInput" class="mb-1">Nombre</label> 
            <!-- Renderizar dinámicamente acá el nombre del alumno -->
            <select name="materia" id="materia" class="w-full p-2 rounded-md border-1 border-black-100">
                <option value="" disabled selected >Selecciona la Materia</option>
                <option value="Algoritmos">Algoritmos</option>
                <option value="DB">Bases de Datos</option>
                <option value="ProgramacionBasica">Programación Básica</option>
                <option value="ProgramacionAvanzada">Programación Avanzada</option>
        </form>        
    </div>
    <section>

        <div class="flex items-center justify-center">
            <button class="bg-blue-600 text-white p-4 rounded-md hover:bg-blue-400 active:bg-blue-200 active:text-black my-4">Registrar nuevo alumno</button>
        </div>
    </section>
    </main>
</body>
</html>
