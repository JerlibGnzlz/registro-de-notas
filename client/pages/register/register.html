<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Notas</title>
    <link rel="stylesheet" href="./register.css">
</head>
<body>
    <header>
        <h1>Welcome a Registro de Notas</h1>
        </header>
        <nav>
            <h4 id="inicio">Inicio</h4>
            <a href="./login.html"><h4>Iniciar Sesión</h4></a>
            <a href="./register.html"><h4>Registrarse</h4></a>
        </nav>
        <div class="formulario">
            <form>
                <label for="name">Nombre</label>
                <input type="text" name="name" id="nameInput" required>
                <label for="email">Correo Electrónico</label>
                <input type="email" name="email" id="emailInput" required>
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="passwordInput" required>
                <label for="password">Confirmar Contraseña</label>
                <input type="password" name="password" id="passwordConfirm" required>
                <button id="registerButton" onclick="validarDatos()">Enviar</button>
            </form>
        </div>
    <footer></footer>
</body>
</html>
