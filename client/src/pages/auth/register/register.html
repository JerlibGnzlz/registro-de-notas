<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../../../assets/img/logo_tareas.png"
      type="image/x-icon"
    />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Registro de Notas</title>
  </head>

  <body class="min-h-screen flex flex-col bg-gradient-to-br from-gray-50 to-gray-200">
    <!-- Main container to center and control width of both header and form -->
    <div class="flex flex-col items-center justify-center flex-grow p-4">
      <!-- Header with same width as form -->
      <header class="bg-gradient-to-r from-blue-600 to-blue-700 shadow-lg w-full max-w-md rounded-t-lg overflow-hidden">
        <div class="flex justify-center py-2">
          <div class="relative inline-block">
            <img src="../../../assets/img/logo_tareas.png" class="h-28 drop-shadow-md" alt="" />
            <p
              class="absolute inset-0 flex items-center justify-center text-white text-2xl font-bold"
              style="
                text-shadow: -1px -1px 0 black, 1px -1px 0 black, -1px 1px 0 black,
                  1px 1px 0 black;
              "
            >
              NotasApp
            </p>
          </div>
        </div>
      </header>

      <!-- Form with same width as header and no gap between -->
      <form
        id="registerForm"
        class="flex flex-col items-center justify-center space-y-5 bg-white p-8 shadow-xl px-10 w-full max-w-md rounded-b-lg border border-gray-100"
      >
        <div class="flex flex-col w-full">
          <label for="nameInput" class="mb-1 text-center font-medium text-gray-700">Nombre</label>
          <input
            type="text"
            id="nameInput"
            class="border border-gray-300 p-2 rounded-lg text-center w-full focus:outline-none focus:border-blue-500 transition-all duration-200 ease-in-out focus:ring-2 focus:ring-blue-500/30"
            placeholder="💬 Juan Perez"
          />
        </div>

        <div class="flex flex-col w-full">
          <label for="emailInput" class="mb-1 text-center font-medium text-gray-700">Correo Electrónico</label>
          <input
            type="email"
            id="emailInput"
            class="border border-gray-300 p-2 rounded-lg text-center w-full focus:outline-none focus:border-blue-500 transition-all duration-200 ease-in-out focus:ring-2 focus:ring-blue-500/30"
            placeholder="📧 correo@correo.com"
          />
        </div>

        <div class="flex flex-col w-full">
          <label for="passwordInput" class="mb-1 text-center font-medium text-gray-700">Contraseña</label>
          <div class="relative w-full group">
            <input
              type="password"
              id="passwordInput"
              class="border border-gray-300 p-2 rounded-lg text-center w-full focus:outline-none focus:border-blue-500 transition-all duration-200 ease-in-out focus:ring-2 focus:ring-blue-500/30"
              placeholder="🔑 ******"
            />
            <button 
              type="button" 
              id="togglePassword1" 
              class="toggle-btn absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none"
            >
              <!-- Eye icon (password hidden) -->
              <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hover:scale-110 transition-transform duration-200 ease-in-out" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye-off icon (password visible) - initially hidden -->
              <svg id="eyeOffIcon1" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden hover:scale-110 transition-transform duration-200 ease-in-out" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex flex-col w-full">
          <label for="confirmPasswordInput" class="mb-1 text-center font-medium text-gray-700">Confirmar Contraseña</label>
          <div class="relative w-full group">
            <input
              type="password"
              id="confirmPasswordInput"
              class="border border-gray-300 p-2 rounded-lg text-center w-full focus:outline-none focus:border-blue-500 transition-all duration-200 ease-in-out focus:ring-2 focus:ring-blue-500/30"
              placeholder="🔑 ******"
            />
            <button 
              type="button" 
              id="togglePassword2" 
              class="toggle-btn absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none"
            >
              <!-- Eye icon (password hidden) -->
              <svg id="eyeIcon2" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hover:scale-110 transition-transform duration-200 ease-in-out" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye-off icon (password visible) - initially hidden -->
              <svg id="eyeOffIcon2" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden hover:scale-110 transition-transform duration-200 ease-in-out" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="registerButton"
          class="mt-4 bg-gradient-to-r from-blue-500 to-blue-600 text-white px-8 py-3 rounded-lg hover:from-blue-600 hover:to-blue-700 active:from-blue-700 active:to-blue-800 transition-all duration-300 ease-in-out hover:-translate-y-0.5 active:translate-y-px shadow-md hover:shadow-lg text-xl flex items-center justify-center"
        >
          <span>Registrarse</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L12.586 11H5a1 1 0 110-2h7.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </form>
    </div>

    <footer class="text-center py-4 bg-gray-800 text-white mt-auto text-2xl">
      <p>© 2025 - Todos los derechos reservados.</p>
    </footer>
    <script type="module" src="../register/register.js"></script>
  </body>
</html>
