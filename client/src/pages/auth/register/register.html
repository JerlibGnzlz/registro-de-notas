<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../../../assets/img/logo_tareas.png"
      type="image/x-icon"
    />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Registro de Notas</title>
  </head>

  <body class="min-h-screen flex flex-col bg-gray-100">
    <!-- Main container to center and control width of both header and form -->
    <div class="flex flex-col items-center justify-center flex-grow">
      <!-- Header with same width as form -->
      <header class="bg-blue-600 shadow-md w-full max-w-md rounded-t">
        <div class="flex justify-center">
          <div class="relative inline-block">
            <img src="../../../assets/img/logo_tareas.png" class="h-28" alt="" />
            <p
              class="absolute inset-0 flex items-center justify-center text-white text-2xl font-bold"
              style="
                text-shadow: -1px -1px 0 black, 1px -1px 0 black, -1px 1px 0 black,
                  1px 1px 0 black;
              "
            >
              NotasApp
            </p>
          </div>
        </div>
      </header>

      <!-- Form with same width as header and no gap between -->
      <form
        id="registerForm"
        class="flex flex-col items-center justify-center space-y-4 bg-white p-8 shadow-md px-10 w-full max-w-md rounded-b"
      >
        <div class="flex flex-col w-full">
          <label for="nameInput" class="mb-1 text-center">Nombre</label>
          <input
            type="text"
            id="nameInput"
            class="border p-2 rounded text-center"
            placeholder="💬 Juan Perez"
          />
        </div>

        <div class="flex flex-col w-full">
          <label for="emailInput" class="mb-1 text-center">Correo Electrónico</label>
          <input
            type="email"
            id="emailInput"
            class="border p-2 rounded text-center"
            placeholder="📧 correo@correo.com"
          />
        </div>

        <div class="flex flex-col w-full">
          <label for="passwordInput" class="mb-1 text-center">Contraseña</label>
          <div class="relative w-full">
            <input
              type="password"
              id="passwordInput"
              class="border p-2 rounded text-center w-full"
              placeholder="🔑 ******"
            />
            <button 
              type="button" 
              id="togglePassword1" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 hover:text-gray-800 focus:outline-none"
            >
              <!-- Eye icon (password hidden) -->
              <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye-off icon (password visible) - initially hidden -->
              <svg id="eyeOffIcon1" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex flex-col w-full">
          <label for="confirmPasswordInput" class="mb-1 text-center">Confirmar Contraseña</label>
          <div class="relative w-full">
            <input
              type="password"
              id="confirmPasswordInput"
              class="border p-2 rounded text-center w-full"
              placeholder="🔑 ******"
            />
            <button 
              type="button" 
              id="togglePassword2" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 hover:text-gray-800 focus:outline-none"
            >
              <!-- Eye icon (password hidden) -->
              <svg id="eyeIcon2" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye-off icon (password visible) - initially hidden -->
              <svg id="eyeOffIcon2" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="registerButton"
          class="mt-2 bg-blue-500 text-white px-8 py-2 rounded hover:bg-blue-600 active:bg-blue-700 rounded-x2 text-xl"
        >
          Enviar
        </button>
      </form>
    </div>

    <footer class="text-center py-4 bg-gray-800 text-white mt-auto text-2xl">
      <p>&copy; 2025 - Todos los derechos reservados.</p>
    </footer>

    <script>
      // Toggle menú móvil
      document.getElementById("menu-toggle")?.addEventListener("click", () => {
        document.getElementById("mobile-menu")?.classList.toggle("hidden");
      });
      
      // Toggle password visibility for first password field
      document.getElementById("togglePassword1")?.addEventListener("click", () => {
        const passwordInput = document.getElementById("passwordInput");
        const eyeIcon = document.getElementById("eyeIcon1");
        const eyeOffIcon = document.getElementById("eyeOffIcon1");
        
        // Toggle the type attribute
        const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        
        // Toggle the icon
        eyeIcon.classList.toggle("hidden");
        eyeOffIcon.classList.toggle("hidden");
      });
      
      // Toggle password visibility for confirm password field
      document.getElementById("togglePassword2")?.addEventListener("click", () => {
        const confirmPasswordInput = document.getElementById("confirmPasswordInput");
        const eyeIcon = document.getElementById("eyeIcon2");
        const eyeOffIcon = document.getElementById("eyeOffIcon2");
        
        // Toggle the type attribute
        const type = confirmPasswordInput.getAttribute("type") === "password" ? "text" : "password";
        confirmPasswordInput.setAttribute("type", type);
        
        // Toggle the icon
        eyeIcon.classList.toggle("hidden");
        eyeOffIcon.classList.toggle("hidden");
      });
    </script>
    <script type="module" src="../register/register.js"></script>
  </body>
</html>
