<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../../assets/img/logo_tareas.png"
      type="image/x-icon"
    />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.com/libraries/bodymovin"></script>
    <title>NotasApp</title>
  </head>
  <body class="min-h-screen flex flex-col bg-gray-100">
    <header class="bg-blue-600 shadow-md">
      <nav
        class="container mx-auto flex justify-evenly items-center p-1 text-2xl"
      >
        <div class="relative inline-block">
          <img src="../../assets/img/logo_tareas.png" class="h-28" alt="" />
          <p
            class="absolute inset-0 flex items-center justify-center text-white text-2xl font-bold"
            style="
              text-shadow: -1px -1px 0 black, 1px -1px 0 black, -1px 1px 0 black,
                1px 1px 0 black;
            "
          >
            NotasApp
          </p>
        </div>

        <!-- Menú Desktop -->
        <ul class="hidden md:flex space-x-6 text-white">
          <li><a href="/" class="hover:text-gray-300 transition">Inicio</a></li>
          <li>
            <a
              href="./src/pages/auth/login/login.html"
              class="hover:text-gray-300 transition"
              >Login</a
            >
          </li>
          <li>
            <a
              href="./src/pages/auth/register/register.html"
              class="hover:text-gray-300 transition"
              >Registro</a
            >
          </li>
          <li>
            <a
              href="./src/pages/dashboard/registro-alumnos/registroAlumnos.html"
              class="hover:text-gray-300 transition"
              >Alumnos</a
            >
          </li>
          <li>
            <a
              href="./src/pages/dashboard/registro-notas/registroNotas.html"
              class="hover:text-gray-300 transition"
              >Notas</a
            >
          </li>
        </ul>

        <!-- Botón para menú móvil -->
        <button id="menu-toggle" class="md:hidden text-white text-2xl">
          ☰
        </button>
      </nav>

      <!-- Menú Móvil -->
      <ul
        id="mobile-menu"
        class="hidden flex-col bg-blue-600 text-white space-y-2 px-4 md:hidden"
      >
        <li><a href="/" class="block py-2 hover:bg-blue-500">Inicio</a></li>
        <li>
          <a
            href="./src/pages/auth/login/login.html"
            class="block py-2 hover:bg-blue-500"
            >Login</a
          >
        </li>
        <li>
          <a
            href="./src/pages/auth/register/register.html"
            class="block py-2 hover:bg-blue-500"
            >Registro</a
          >
        </li>
        <li>
          <a
            href="./src/pages/dashboard/registro-alumnos/registroAlumnos.html"
            class="block py-2 hover:bg-blue-500"
            >Alumnos</a
          >
        </li>
        <li>
          <a
            href="./src/pages/dashboard/registro-notas/registroNotas.html"
            class="block py-2 hover:bg-blue-500"
            >Notas</a
          >
        </li>
      </ul>
    </header>
    <button
      id="logoutButton"
      class="bg-red-600 text-white p-2 rounded-md hover:bg-red-500 active:bg-red-400 w-1/10 flex m-4"
    >
      Cerrar sesión
    </button>
    <div class="flex justify-center mb-4 justify-self-left">
      <main
        class="bg-sky-200 h-auto w-300 flex justify-center items-center rounded-md"
      >
        <div class="ingreso flex flex-col">
          <header class="rounded-md bg-cyan-400 text-center w-full p-4 mt-8">
            <h1 class="text-xl font-bold">Registro de Alumnos</h1>
          </header>
          <form
            action=""
            class="flex flex-col items-center justify-center space-y-4 bg-white p-8 rounded shadow-md w-full"
          >
            <label for="nameInput" class="mb-1">Nombre</label>
            <input
              type="text"
              class="border p-2 rounded w-3/4 px-4"
              placeholder="Ingresa el nombre"
              class="bg-neutral-50"
            />
            <label for="correo">Correo electrónico</label>
            <input
              type="text"
              class="border p-2 rounded w-3/4 px-4"
              placeholder="Ingresa un correo electrónico válido"
            />
            <label for="imagen">Foto del estudiante</label>
            <input
              type="file"
              class="border p-2 rounded w-3/4 px-4"
              placeholder="Ingresa la foto del estudiante"
            />
            <label for="nota2">Número de identificación (RUN/DNI)</label>
            <input
              type="text"
              class="border p-2 rounded w-3/4 px-4"
              placeholder="Ingresa el número de identificación"
            />
            <label for="nota3">Ingresa la fecha de nacimiento</label>
            <input
              type="date"
              class="border p-2 rounded w-3/4 px-4"
              placeholder="Ingresa la fecha de nacimiento"
            />
          </form>
          <section>
            <div class="flex items-center justify-center">
              <button
                id="registrarAlumno"
                class="bg-blue-600 text-white p-4 rounded-md hover:bg-blue-400 active:bg-blue-200 active:text-black my-4"
                onclick="ingresarCalificaciones()"
              >
                Continuar 
              </button>
            </div>
          </section>
        </div>

        <!-- Hidden es Display None, cambiará con el botón del primer formulario -->
        <div class="mx-8 hidden" id="calificaciones">
          <header class="rounded-md bg-cyan-400 text-center w-full p-4">
            <h1 class="text-xl font-bold">Registro de Notas</h1>
          </header>
          <form
            action=""
            class="flex flex-col items-center justify-center space-y-4 bg-white p-8 rounded shadow-md w-full"
          >
            <label for="nameInput" class="mb-1">Nombre</label>
            <!-- Renderizar dinámicamente acá el nombre del alumno -->
            <select
              name="materia"
              id="materiaSelect"
              class="w-full p-2 rounded-md border-1 border-black-100"
            >
              <option value="" disabled selected>Selecciona la Materia</option>
              <option value="Algoritmos">Algoritmos</option>
              <option value="DB">Bases de Datos</option>
              <option value="ProgramacionBasica">Programación Básica</option>
              <option value="ProgramacionAvanzada">
                Programación Avanzada
              </option>
            </select>
            <label for="nota1">Ingresa la calificación aquí</label>
            <select
              name="nota"
              id="nota"
              class="w-full p-2 rounded-md border-1 border-black-100"
            >
              <option value="" disabled selected>Selecciona la Nota</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </form>
          <section>
            <ul
              id="materias"
              class="flex flex-row justify-center px-4 mt-2"
            ></ul>
            <div class="flex items-center justify-center">
              <button
                class="bg-blue-600 text-white p-4 rounded-md hover:bg-blue-400 active:bg-blue-200 active:text-black my-4"
              >
                Registrar nueva calificación                            
              </button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <footer class="text-center py-4 bg-gray-800 text-white mt-auto text-2xl">
      <p>&copy; 2025 - Todos los derechos reservados.</p>
    </footer>

    <script>
      // Toggle menú móvil
      document.getElementById("menu-toggle").addEventListener("click", () => {
        document.getElementById("mobile-menu").classList.toggle("hidden");
      });
    </script>
    <script src="./dashboard.js"></script>
  </body>
</html>
