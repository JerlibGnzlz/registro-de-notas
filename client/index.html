<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Notas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-gray-100">
    <header class="bg-blue-600 shadow-md">
        <nav class="container mx-auto flex justify-between items-center p-4">
            <a href="/" class="text-white text-2xl font-bold">NotasApp</a>

            <!-- Menú Desktop -->
            <ul class="hidden md:flex space-x-6 text-white">
                <li><a href="/" class="hover:text-gray-300 transition">Inicio</a></li>
                <li><a href="./src/pages/auth/login/login.html" class="hover:text-gray-300 transition">Login</a></li>
                <li><a href="./src/pages/auth/register/register.html"
                        class="hover:text-gray-300 transition">Registro</a></li>
                <li><a href="./src/pages/dashboard/registro-alumnos/registroAlumnos.html"
                        class="hover:text-gray-300 transition">Alumnos</a></li>
                <li><a href="./src/pages/dashboard/registro-notas/registroNotas.html"
                        class="hover:text-gray-300 transition">Notas</a></li>
            </ul>

            <!-- Botón para menú móvil -->
            <button id="menu-toggle" class="md:hidden text-white text-2xl">
                ☰
            </button>
        </nav>

        <!-- Menú Móvil -->
        <ul id="mobile-menu" class="hidden flex-col bg-blue-600 text-white space-y-2 p-4 md:hidden">
            <li><a href="/" class="block py-2 hover:bg-blue-500">Inicio</a></li>
            <li><a href="./src/pages/auth/login/login.html" class="block py-2 hover:bg-blue-500">Login</a></li>
            <li><a href="./src/pages/auth/register/register.html" class="block py-2 hover:bg-blue-500">Registro</a></li>
            <li><a href="./src/pages/dashboard/registro-alumnos/registroAlumnos.html"
                    class="block py-2 hover:bg-blue-500">Alumnos</a></li>
            <li><a href="./src/pages/dashboard/registro-notas/registroNotas.html"
                    class="block py-2 hover:bg-blue-500">Notas</a></li>
        </ul>
    </header>

    <main class="container mx-auto p-6 flex-grow">
        <h1 class="text-3xl font-bold text-gray-700 text-center">Bienvenido al Registro de Notas</h1>
    </main>

    <footer class="text-center py-4 bg-gray-800 text-white mt-auto">
        <p>&copy; 2025 - Todos los derechos reservados.</p>
    </footer>

    <script>
        // Toggle menú móvil
        document.getElementById("menu-toggle").addEventListener("click", () => {
            document.getElementById("mobile-menu").classList.toggle("hidden");
        });
    </script>
</body>

</html>
